name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ktlint:
    name: コード整形の確認
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK のセットアップ
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # 違反があればここで落とす。直し方は ./gradlew ktlintFormat
      - name: ktlintCheck
        run: ./gradlew ktlintCheck

  backend:
    name: backend / crypto / repository ビルド・テスト
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK のセットアップ
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # :backend:build だけだと依存先の :repository は jar が作られるだけでテストが走らない
      - name: ビルド・テスト
        run: ./gradlew :crypto:build :repository:build :backend:build

  frontend:
    name: frontend ビルド
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK のセットアップ
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Wasm バンドルのビルド
        run: ./gradlew :frontend:wasmJsBrowserDistribution

      - name: 成果物の確認
        run: |
          DIST=frontend/build/dist/wasmJs/productionExecutable
          ls -la "$DIST"
          test -f "$DIST/index.html"
          test -f "$DIST/frontend.js"
          ls "$DIST"/*.wasm > /dev/null

  native-test:
    name: crypto の native テスト
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GraalVM のセットアップ
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # JCA が native-image 上で動くかは JVM のテストでは分からないので、
      # テストごと native バイナリにして実行する
      - name: native テスト
        run: ./gradlew :crypto:nativeTest

  native-image:
    name: native-image ビルド
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GraalVM のセットアップ
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: native-image ビルド
        run: ./gradlew :backend:nativeCompile

      - name: 起動確認
        run: |
          set -euo pipefail

          # 一時ディレクトリを DB_PATH に渡して、SQLite への書き込みも確認する
          export DB_PATH="$RUNNER_TEMP/native-check/mastodon-rss.db"

          ./backend/build/native/nativeCompile/mastodon-rss > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz -o /tmp/response.txt; then
              break
            fi
            sleep 1
          done

          # 失敗の原因が分かるよう、レスポンスとログとプロセスの状態を出してから落とす。
          # curl -sf は 500 でも失敗するので、応答があったかどうかを分けて表示する
          if ! grep -q '"status":"ok"' /tmp/response.txt 2>/dev/null; then
            echo "::error::サーバーの起動確認に失敗しました"

            if kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "--- プロセスは生きている。応答の中身を見る ---"
            else
              echo "--- プロセスが落ちている ---"
            fi

            echo "--- HTTP レスポンス ---"
            curl -si --max-time 5 http://localhost:8080/healthz || echo "接続できなかった"

            echo "--- サーバーログ ---"
            cat /tmp/server.log
            exit 1
          fi

          # マイグレーションが適用され、書き込みまで通っていることを確かめる。
          # native バイナリではリソースの同梱漏れやネイティブライブラリの
          # 展開失敗が起きても、起動自体は通ってしまうことがある
          echo "--- DB ファイル ---"
          ls -la "$(dirname "$DB_PATH")"
          test -f "$DB_PATH"
