name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend / repository ビルド・テスト
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK のセットアップ
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # :backend:build だけだと依存先の :repository は jar が作られるだけでテストが走らない
      - name: ビルド・テスト
        run: ./gradlew :repository:build :backend:build

  frontend:
    name: frontend ビルド
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK のセットアップ
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Wasm バンドルのビルド
        run: ./gradlew :frontend:wasmJsBrowserDistribution

      - name: 成果物の確認
        run: |
          DIST=frontend/build/dist/wasmJs/productionExecutable
          ls -la "$DIST"
          test -f "$DIST/index.html"
          test -f "$DIST/frontend.js"
          ls "$DIST"/*.wasm > /dev/null

  native-image:
    name: native-image ビルド
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GraalVM のセットアップ
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: native-image ビルド
        run: ./gradlew :backend:nativeCompile

      - name: 起動確認
        run: |
          set -euo pipefail
          ./backend/build/native/nativeCompile/mastodon-rss > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz -o /tmp/response.txt; then
              break
            fi
            sleep 1
          done

          # 立ち上がらなかった場合に原因が分かるようログを出してから落とす
          if ! grep -q '"status":"ok"' /tmp/response.txt 2>/dev/null; then
            echo "::error::サーバーの起動確認に失敗しました"
            cat /tmp/server.log
            exit 1
          fi
