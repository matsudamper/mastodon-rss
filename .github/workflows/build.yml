name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # 違反があればここで落とす。直し方は ./gradlew ktlintFormat
      - name: ktlintCheck
        run: ./gradlew ktlintCheck

  backend:
    name: backend test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # build ではなく test にしているのは、build に付いてくる ktlintCheck が
      # ktlint ジョブと重複し、application プラグインの distZip / distTar も
      # 作られるため。配布は native-image なのでアーカイブは使わない
      - name: test
        run: ./gradlew test

  frontend:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Wasm バンドルのビルド
        run: ./gradlew :frontend:wasmJsBrowserDistribution

      - name: 成果物の確認
        run: |
          set -euo pipefail

          DIST=frontend/build/dist/wasmJs/productionExecutable
          ls -la "$DIST"
          test -f "$DIST/index.html"
          ls "$DIST"/*.wasm > /dev/null

          BUNDLE=$(sed -n 's|.*<script src="/\(frontend\.[0-9a-f]\{1,\}\.js\)".*|\1|p' "$DIST/index.html")
          test -f "$DIST/$BUNDLE"

  native-test:
    name: native backend test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup GraalVM
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # JCA と StAX が native-image 上で動くかは JVM のテストでは分からないので、
      # テストごと native バイナリにして実行する。
      # どちらも実装を実行時に探す作りで、解決に失敗すると実バイナリだけが落ちる。
      # GraalVM のセットアップが重いので、ジョブは分けずに 2 つとも回す
      - name: crypto の native テスト
        run: ./gradlew :backend:crypto:nativeTest

      - name: rss の native テスト
        run: ./gradlew :backend:rss:nativeTest

  native-image:
    name: native-image build
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GraalVM のセットアップ
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: native-image ビルド
        run: ./gradlew :backend:nativeCompile

      - name: 起動確認
        run: |
          set -euo pipefail

          # 一時ディレクトリを DB_PATH に渡して、SQLite への書き込みも確認する
          export DB_PATH="$RUNNER_TEMP/native-check/mastodon-rss.db"

          # 起動時のスキーマ自動適用は無い（実運用では sqlite3def で手適用する）。
          # 空の DB だと verifyWritable が落ちるので、実運用の手適用にあたる操作をここでやる
          mkdir -p "$(dirname "$DB_PATH")"
          sqlite3 "$DB_PATH" < backend/repository/src/main/resources/db/schema.sql
          sqlite3 "$DB_PATH" \
            "INSERT INTO accounts (username, created_at) VALUES ('admin', '2026-01-01T00:00:00Z');"
          sqlite3 "$DB_PATH" \
            "INSERT INTO accounts (username, created_at) VALUES ('ci-feed', '2026-01-01T00:00:00Z');"
          # 鍵の生成と書き出しも native バイナリで動く必要がある
          export ACTOR_PRIVATE_KEY_PATH="$RUNNER_TEMP/native-check/actor-private-key.pem"
          # パスワードは ci-password。このジョブの中でしか使わない使い捨て
          export ADMIN_PASSWORD_HASH='pbkdf2-sha256:210000:HP9l044PxKN0LJhMy5GyrQ:tWTwqvZDQgC75D39BMPPm2TvA3F9S3bUP1-XyH5l4HQ'
          # http で叩くので、Secure を付けると Cookie の確認ができない
          export ADMIN_COOKIE_SECURE=false
          # DOMAIN は必須。未設定だと起動せず、WebFinger と Actor も確認できない
          export DOMAIN=example.com

          ./backend/build/native/nativeCompile/mastodon-rss > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz -o /tmp/response.txt; then
              break
            fi
            sleep 1
          done

          # 失敗の原因が分かるよう、レスポンスとログとプロセスの状態を出してから落とす。
          # curl -sf は 500 でも失敗するので、応答があったかどうかを分けて表示する
          if ! grep -q '"status":"ok"' /tmp/response.txt 2>/dev/null; then
            echo "::error::サーバーの起動確認に失敗しました"

            if kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "--- プロセスは生きている。応答の中身を見る ---"
            else
              echo "--- プロセスが落ちている ---"
            fi

            echo "--- HTTP レスポンス ---"
            curl -si --max-time 5 http://localhost:8080/healthz || echo "接続できなかった"

            echo "--- サーバーログ ---"
            cat /tmp/server.log
            exit 1
          fi

          # jOOQ 経由の書き込みまで通っていることを確かめる。
          # native バイナリではリソースの同梱漏れやネイティブライブラリの
          # 展開失敗が起きても、起動自体は通ってしまうことがある
          echo "--- DB ファイル ---"
          ls -la "$(dirname "$DB_PATH")"
          test -f "$DB_PATH"

          # 鍵は JCA での生成とファイルへの書き出しの両方を通る。成功時の
          # サーバーログは出さないので、結果をここで確かめる
          echo "--- アクターの秘密鍵 ---"
          test -f "$ACTOR_PRIVATE_KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$ACTOR_PRIVATE_KEY_PATH"
          # 所有者以外に読めていたら権限の指定が効いていない
          test "$(stat -c '%a' "$ACTOR_PRIVATE_KEY_PATH")" = "600"

          # WebFinger と Actor は @SerialName とカスタム serializer を通る。
          # native-image でシリアライザの解決に失敗すると 500 になり、
          # JVM のテストでは分からないのでここで実際に叩く
          echo "--- WebFinger ---"
          curl -sf "http://localhost:8080/.well-known/webfinger?resource=acct:admin@example.com" \
            -o /tmp/webfinger.json
          cat /tmp/webfinger.json
          grep -q '"subject":"acct:admin@example.com"' /tmp/webfinger.json
          grep -q '"href":"https://example.com/users/admin"' /tmp/webfinger.json

          echo "--- Actor ---"
          curl -sf -H 'Accept: application/activity+json' http://localhost:8080/users/admin \
            -o /tmp/actor.json
          cat /tmp/actor.json
          grep -q '"id":"https://example.com/users/admin"' /tmp/actor.json
          # 公開鍵は起動時に秘密鍵から導く。native-image で JCA が欠けるとここが落ちる
          grep -q 'BEGIN PUBLIC KEY' /tmp/actor.json

          # 知らない相手に 200 を返すと、Mastodon から空のアカウントが見えてしまう
          echo "--- 知らない resource は 404 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:8080/.well-known/webfinger?resource=acct:other@example.com")" = "404"

          # 2 件目も同じ経路で引ける
          echo "--- 2 件目のアカウント ---"
          curl -sf "http://localhost:8080/.well-known/webfinger?resource=acct:ci-feed@example.com" \
            -o /tmp/added-webfinger.json
          grep -q '"subject":"acct:ci-feed@example.com"' /tmp/added-webfinger.json

          curl -sf -H 'Accept: application/activity+json' http://localhost:8080/users/ci-feed \
            -o /tmp/added-actor.json
          grep -q '"id":"https://example.com/users/ci-feed"' /tmp/added-actor.json

          # 署名の検証は JCA を通る。native-image で欠けると素通りするか 500 になる。
          # 正しい署名を bash で作るのは割に合わないので、署名が無いときに
          # 401 で落ちること（＝検証まで到達していること）だけを確かめる
          echo "--- inbox は署名が無ければ 401 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/activity+json' \
            -d '{"type":"Follow"}' \
            "http://localhost:8080/users/admin/inbox")" = "401"

          echo "--- 知らないアクターの inbox は 404 ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/activity+json' \
            -d '{"type":"Follow"}' \
            "http://localhost:8080/users/other/inbox")" = "404"

          # graphql-java が native-image で動くか、スキーマが同梱されているかは
          # JVM のテストでは分からない
          echo "--- GraphQL の query ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"query":"query { admin { session { loggedIn passwordConfigured } } }"}' \
            http://localhost:8080/graphql -o /tmp/graphql-session.json
          cat /tmp/graphql-session.json
          grep -q '"loggedIn":false' /tmp/graphql-session.json
          grep -q '"passwordConfigured":true' /tmp/graphql-session.json

          # アカウント画面が引く口。DataLoader を通るのはここだけなので、
          # native バイナリで動くかは他の問い合わせでは分からない
          echo "--- GraphQL のアカウント（ログイン不要） ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"query":"query Account($username: String!) { account(username: $username) { username acct actorUrl } }","variables":{"username":"ci-feed"}}' \
            http://localhost:8080/graphql -o /tmp/graphql-account.json
          cat /tmp/graphql-account.json
          grep -q '"acct":"@ci-feed@example.com"' /tmp/graphql-account.json

          # ホーム画面が使う一覧。1 件だけ求めるとページが切れて続きのカーソルが返る
          echo "--- GraphQL の公開アカウント一覧（ログイン不要） ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"query":"query Accounts($limit: Int!) { accounts(limit: $limit) { nodes { username acct actorUrl } pageInfo { hasMore nextCursor } } }","variables":{"limit":1}}' \
            http://localhost:8080/graphql -o /tmp/graphql-accounts-public.json
          cat /tmp/graphql-accounts-public.json
          grep -q '"acct":"@admin@example.com"' /tmp/graphql-accounts-public.json
          grep -q '"hasMore":true' /tmp/graphql-accounts-public.json

          # limit は上限で丸める。Int の最大値でも加算があふれて空ページにならない
          echo "--- GraphQL の公開アカウント一覧（limit が大きすぎる） ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"query":"query Accounts($limit: Int!) { accounts(limit: $limit) { nodes { username } pageInfo { hasMore } } }","variables":{"limit":2147483647}}' \
            http://localhost:8080/graphql -o /tmp/graphql-accounts-max.json
          cat /tmp/graphql-accounts-max.json
          grep -q '"username":"ci-feed"' /tmp/graphql-accounts-max.json

          # 無い名前はエラーではなく null。画面はこれを見て見つからない表示にする
          echo "--- GraphQL の無い名前のアカウント ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"query":"query { account(username: \"ci-unknown\") { username } }"}' \
            http://localhost:8080/graphql -o /tmp/graphql-account-unknown.json
          cat /tmp/graphql-account-unknown.json
          grep -q '"account":null' /tmp/graphql-account-unknown.json

          # 変数と enum の経路を通す
          echo "--- GraphQL の mutation（パスワードが違う） ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"query":"mutation Login($password: String!) { admin { login(password: $password) { failure } } }","variables":{"password":"wrong"}}' \
            http://localhost:8080/graphql -o /tmp/graphql-wrong.json
          cat /tmp/graphql-wrong.json
          grep -q '"failure":"WRONG_PASSWORD"' /tmp/graphql-wrong.json

          # PBKDF2 の照合と Set-Cookie まで通す
          echo "--- GraphQL の mutation（ログイン） ---"
          curl -sf -D /tmp/graphql-login-headers.txt -X POST -H 'Content-Type: application/json' \
            -d '{"query":"mutation Login($password: String!) { admin { login(password: $password) { session { loggedIn } failure } } }","variables":{"password":"ci-password"}}' \
            http://localhost:8080/graphql -o /tmp/graphql-login.json
          cat /tmp/graphql-login.json
          grep -q '"loggedIn":true' /tmp/graphql-login.json
          grep -q '"failure":null' /tmp/graphql-login.json
          grep -qi 'set-cookie: admin_session=' /tmp/graphql-login-headers.txt

          # この先の確認はログインが要る
          SESSION_COOKIE="$(grep -io 'admin_session=[^;]*' /tmp/graphql-login-headers.txt | head -n 1)"

          # 一覧は DB を読む。事前に入れておいたものが揃う
          echo "--- GraphQL のアカウント一覧 ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -H "Cookie: $SESSION_COOKIE" \
            -d '{"query":"query { admin { adminAccounts { account { username acct } createdAt } } }"}' \
            http://localhost:8080/graphql -o /tmp/graphql-accounts.json
          cat /tmp/graphql-accounts.json
          grep -q '"acct":"@admin@example.com"' /tmp/graphql-accounts.json
          grep -q '"acct":"@ci-feed@example.com"' /tmp/graphql-accounts.json
          # UnixTime の scalar は登録漏れがあると実行時に落ちる。事前に入れた行の時刻を見る
          grep -q '"createdAt":1767225600' /tmp/graphql-accounts.json

          # 1 件引く口と、DataLoader で数えるフォロワー数。結線の漏れは native でだけ出る
          echo "--- GraphQL のアカウント 1 件 ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -H "Cookie: $SESSION_COOKIE" \
            -d '{"query":"query Account($username: String!) { admin { adminAccount(username: $username) { account { acct } followerCount } } }","variables":{"username":"ci-feed"}}' \
            http://localhost:8080/graphql -o /tmp/graphql-admin-account.json
          cat /tmp/graphql-admin-account.json
          grep -q '"acct":"@ci-feed@example.com"' /tmp/graphql-admin-account.json
          grep -q '"followerCount":0' /tmp/graphql-admin-account.json

          # saveFeed の input は Jackson が組み立てる。
          # shared の AccountId のコンストラクタが native-image から落ちると
          # InvalidDefinitionException になる。
          echo "--- GraphQL のフィード登録（input の AccountId） ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -H "Cookie: $SESSION_COOKIE" \
            -d '{"query":"query Account($username: String!) { admin { adminAccount(username: $username) { account { id } } } }","variables":{"username":"ci-feed"}}' \
            http://localhost:8080/graphql -o /tmp/graphql-save-account.json
          cat /tmp/graphql-save-account.json
          ACCOUNT_ID="$(python3 -c "import json; print(json.load(open('/tmp/graphql-save-account.json'))['data']['admin']['adminAccount']['account']['id'])")"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -H "Cookie: $SESSION_COOKIE" \
            -d '{"query":"mutation Save($q: SaveFeedQuery!) { admin { saveFeed(saveFeedQuery: $q) { failure { reason } } } }","variables":{"q":{"accountId":'"$ACCOUNT_ID"',"url":"not-a-url"}}}' \
            http://localhost:8080/graphql -o /tmp/graphql-save-feed.json
          cat /tmp/graphql-save-feed.json
          grep -q '"reason":"INVALID_URL"' /tmp/graphql-save-feed.json
          if grep -q '"errors"' /tmp/graphql-save-feed.json; then
            echo "::error::saveFeed が errors を返した。input の AccountId を組み立てられていない"
            exit 1
          fi

          # deleteFeedItem の input には FeedItemId が入る。native-image から
          # 落ちていると組み立てられず errors になる。フィードが無いので NO_FEED が返る
          echo "--- GraphQL の記事削除（input の FeedItemId） ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -H "Cookie: $SESSION_COOKIE" \
            -d '{"query":"mutation Delete($q: DeleteFeedItemQuery!) { admin { deleteFeedItem(query: $q) { deletedId failure { reason } } } }","variables":{"q":{"accountId":'"$ACCOUNT_ID"',"feedItemId":1}}}' \
            http://localhost:8080/graphql -o /tmp/graphql-delete-feed-item.json
          cat /tmp/graphql-delete-feed-item.json
          grep -q '"reason":"NO_FEED"' /tmp/graphql-delete-feed-item.json
          if grep -q '"errors"' /tmp/graphql-delete-feed-item.json; then
            echo "::error::deleteFeedItem が errors を返した。input の FeedItemId を組み立てられていない"
            exit 1
          fi

          # 取り込んだ記事の一覧も Connection の型を通る。フィードが無いので失敗が返る
          echo "--- GraphQL の記事一覧 ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -H "Cookie: $SESSION_COOKIE" \
            -d '{"query":"query Items($q: FeedItemsQuery!) { admin { feedItems(query: $q) { connection { nodes { id } } failure { reason } } } }","variables":{"q":{"accountId":'"$ACCOUNT_ID"',"limit":10}}}' \
            http://localhost:8080/graphql -o /tmp/graphql-feed-items.json
          cat /tmp/graphql-feed-items.json
          grep -q '"reason":"NO_FEED"' /tmp/graphql-feed-items.json

          # 投稿の一覧は Connection の型を通る。まだ何も配っていないので空で返る
          echo "--- GraphQL の投稿一覧 ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -H "Cookie: $SESSION_COOKIE" \
            -d '{"query":"query Notes($username: String!) { admin { notes(username: $username, limit: 10) { nodes { url } pageInfo { hasMore nextCursor } } } }","variables":{"username":"ci-feed"}}' \
            http://localhost:8080/graphql -o /tmp/graphql-notes.json
          cat /tmp/graphql-notes.json
          grep -q '"nodes":\[\]' /tmp/graphql-notes.json
          grep -q '"hasMore":false' /tmp/graphql-notes.json

          # 追加は DB への書き込みを通る。入れた名前がそのまま WebFinger から引ける
          echo "--- GraphQL のアカウント追加 ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -H "Cookie: $SESSION_COOKIE" \
            -d '{"query":"mutation Add($username: String!) { admin { addAccount(username: $username) { adminAccount { account { acct } } failure { isDuplicated } } } }","variables":{"username":"ci-added"}}' \
            http://localhost:8080/graphql -o /tmp/graphql-add.json
          cat /tmp/graphql-add.json
          grep -q '"acct":"@ci-added@example.com"' /tmp/graphql-add.json
          grep -q '"failure":null' /tmp/graphql-add.json

          curl -sf "http://localhost:8080/.well-known/webfinger?resource=acct:ci-added@example.com" \
            -o /tmp/added2-webfinger.json
          grep -q '"subject":"acct:ci-added@example.com"' /tmp/added2-webfinger.json

          # ログインしていなければ触れない。開いていると誰でもアカウントを増やせる
          echo "--- ログインしていなければアカウントは触れない ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"query":"query { admin { adminAccounts { account { username } } } }"}' \
            http://localhost:8080/graphql -o /tmp/graphql-accounts-anon.json
          grep -q '"errors"' /tmp/graphql-accounts-anon.json

          echo "--- スキーマに無いフィールドは errors ---"
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"query":"query { admin { unknownField } }"}' \
            http://localhost:8080/graphql -o /tmp/graphql-unknown.json
          grep -q '"errors"' /tmp/graphql-unknown.json

      - name: DOMAIN が無ければ起動しないことの確認
        run: |
          set -euo pipefail

          # 既定値で起動できてしまうと、間違ったドメインのアクター ID が
          # Mastodon 側にキャッシュされて後から直せない
          export DB_PATH="$RUNNER_TEMP/no-domain/mastodon-rss.db"
          export ACTOR_PRIVATE_KEY_PATH="$RUNNER_TEMP/no-domain/actor-private-key.pem"

          # 起動を止められていないと待ち受けたまま返ってこないので、
          # timeout で打ち切って「終了しなかった」ことも失敗として扱う
          set +e
          timeout 30 ./backend/build/native/nativeCompile/mastodon-rss > /tmp/no-domain.log 2>&1
          STATUS=$?
          set -e

          cat /tmp/no-domain.log

          if [ "$STATUS" -eq 0 ] || [ "$STATUS" -eq 124 ]; then
            echo "::error::DOMAIN が無いのに起動してしまった (exit: $STATUS)"
            exit 1
          fi

          # 何が足りないのか分からないまま落ちるのでは調べようがない
          grep -q "DOMAIN" /tmp/no-domain.log

  build-all-success:
    name: build-all-success
    needs: [ktlint, backend, frontend, native-test, native-image]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ failure() || cancelled() }}
        run: exit 1
