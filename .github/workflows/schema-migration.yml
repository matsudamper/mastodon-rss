name: Schema Migration

on:
  pull_request:
    paths:
      - backend/repository/src/main/resources/db/schema.sql
      - .github/workflows/schema-migration.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SQLDEF_VERSION: v3.11.24
  SCHEMA_PATH: backend/repository/src/main/resources/db/schema.sql

jobs:
  migrate-from-base:
    name: マージ先のスキーマからの移行
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: sqlite3def のインストール
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sqldef"
          curl -sSfL \
            "https://github.com/sqldef/sqldef/releases/download/${SQLDEF_VERSION}/sqlite3def_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/sqldef"
          echo "$RUNNER_TEMP/sqldef" >> "$GITHUB_PATH"

      - name: マージ先の schema.sql を取り出す
        env:
          # workflow_dispatch では base_ref が無いので main と比べる
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_REF"
          git show "FETCH_HEAD:$SCHEMA_PATH" > "$RUNNER_TEMP/base-schema.sql"

      # 実運用と同じく、マージ先のスキーマが当たっている DB に sqlite3def で差分を当てる
      - name: マージ先のスキーマを適用してから今のスキーマを適用する
        run: |
          set -euo pipefail
          DB="$RUNNER_TEMP/migration.db"

          echo "--- マージ先のスキーマを適用 ---"
          sqlite3def --file "$RUNNER_TEMP/base-schema.sql" "$DB"

          echo "--- 今のスキーマとの差分（dry-run） ---"
          sqlite3def --dry-run --file "$SCHEMA_PATH" "$DB"

          echo "--- 今のスキーマを適用 ---"
          sqlite3def --file "$SCHEMA_PATH" "$DB"

          # 差分が残るなら、sqlite3def では schema.sql の形に移行しきれない
          echo "--- 適用後に差分が残っていないか ---"
          sqlite3def --dry-run --file "$SCHEMA_PATH" "$DB" | tee "$RUNNER_TEMP/remaining.sql"
          if ! grep -q 'Nothing is modified' "$RUNNER_TEMP/remaining.sql"; then
            echo "::error::適用後も schema.sql との差分が残っている"
            exit 1
          fi
