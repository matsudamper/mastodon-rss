name: Publish

on:
  push:
    branches: [main]
  # コンテナまわりを触った PR ではビルドだけ確かめる。
  # main にマージしてから Dockerfile の間違いに気付くのを避ける。
  # Kotlin 側の変更で壊れるとしたら nativeCompile の時点で分かるので、
  # ここでは対象を絞って native ビルドが二重に走らないようにする
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docker-entrypoint.sh
      - .github/workflows/publish.yml

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    name: コンテナイメージのビルド（main なら publish）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # イメージに入れる native バイナリはここで作る。
      # Dockerfile は出来上がったものを置くだけ
      - name: GraalVM のセットアップ
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gradle のセットアップ
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: native バイナリのビルド
        run: ./gradlew :backend:nativeCompile

      # docker と buildx は ubuntu-latest に入っているので、
      # SHA ピン留めの対象を増やさないよう docker コマンドを直接使う
      - name: ghcr.io にログイン
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: イメージ名を決める
        run: |
          set -euo pipefail
          # ghcr.io のリポジトリ名は小文字しか受け付けない
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: イメージのビルド
        run: |
          set -euo pipefail

          # Dockerfile はコンテキスト直下の mastodon-rss を入れるだけなので、
          # nativeCompile の出力をそこに置いてから渡す
          cp backend/build/native/nativeCompile/mastodon-rss ./mastodon-rss

          # latest と commit SHA の 2 つを打つ。
          # 動いていたバージョンに戻せるよう latest だけにはしない
          docker build \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$GITHUB_SHA" \
            .

      - name: 起動確認
        run: |
          set -euo pipefail

          # 起動時のスキーマ自動適用は無い（実運用では sqlite3def で手適用する）。
          # 空の DB だと verifyWritable が落ちるので、適用済みの DB を作ってマウントする。
          # 777 なのはコンテナ内の app ユーザーと uid が合わないため。使い捨てなので構わない
          DATA_DIR="$RUNNER_TEMP/publish-check"
          mkdir -p "$DATA_DIR"
          sqlite3 "$DATA_DIR/mastodon-rss.db" < backend/repository/src/main/resources/db/schema.sql
          chmod -R 777 "$DATA_DIR"

          docker run --rm --detach --name mastodon-rss-check \
            --publish 8080:8080 \
            --env DOMAIN=example.com \
            --volume "$DATA_DIR:/data" \
            "$IMAGE:$GITHUB_SHA"
          trap 'docker rm -f mastodon-rss-check > /dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz -o /tmp/response.txt; then
              break
            fi
            sleep 1
          done

          # イメージの中で起動しないことがあるのは、native バイナリの
          # 動的リンク先がランタイムイメージに無い場合。ログまで出さないと分からない
          if ! grep -q '"status":"ok"' /tmp/response.txt 2>/dev/null; then
            echo "::error::コンテナの起動確認に失敗しました"
            echo "--- HTTP レスポンス ---"
            curl -si --max-time 5 http://localhost:8080/healthz || echo "接続できなかった"
            echo "--- コンテナログ ---"
            docker logs mastodon-rss-check || true
            exit 1
          fi

      - name: push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
