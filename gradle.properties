org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true

# Compose の Kotlin/Wasm プロダクションビルドはヒープを大きく使う。
# 既定値のままだと compileProductionExecutableKotlinWasmJs が OOM で落ちる。
kotlin.daemon.jvmargs=-Xmx4g

# Kotlin/Wasm ターゲットはまだ実験的扱いのため警告が出る。承知の上で使っている
kotlin.js.compiler=ir
kotlin.wasm.stability.nowarn=true
