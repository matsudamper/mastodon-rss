query AccountNotesQuery($username: String!, $cursor: String, $limit: Int!) {
    notes(query: { username: $username, cursor: $cursor, limit: $limit }) {
        nodes {
            ...AccountNoteFields
        }
        pageInfo {
            hasMore
            nextCursor
        }
    }
}

fragment AccountNoteFields on AccountNote {
    url
    contentHtml
    publishedAt
}
