query AccountNotesQuery($query: AccountNotesQuery!) {
    notes(query: $query) {
        nodes {
            ...AccountNoteFields
            linkUrls
        }
        pageInfo {
            hasMore
            nextCursor
        }
    }
}

fragment AccountNoteFields on AccountNote {
    id
    url
    contentHtml
    publishedAt
    favouriteCount
    boostCount
    stamps {
        name
        imageUrl
        count
    }
}
