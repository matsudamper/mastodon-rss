query AccountScreen($username: String!, $notesCursor: String, $notesLimit: Int!) {
    account(username: $username) {
        username
        acct
        actorUrl
    }
    notes(query: { username: $username, cursor: $notesCursor, limit: $notesLimit }) {
        nodes {
            ...AccountNoteFields
        }
        pageInfo {
            hasMore
            nextCursor
        }
    }
}
