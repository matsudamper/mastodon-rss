query AccountScreen($username: String!, $query: AccountNotesQuery!) {
    account(username: $username) {
        id
        username
        acct
        actorUrl
        followerCount
        noteCount
        feed {
            url
            siteUrl
        }
    }
    notes(query: $query) {
        nodes {
            ...AccountNoteFields
        }
        pageInfo {
            hasMore
            nextCursor
        }
    }
}
