query AdminSession {
    admin {
        session {
            ...AdminSessionFields
        }
    }
}

mutation AdminLogin($password: String!) {
    admin {
        login(password: $password) {
            session {
                ...AdminSessionFields
            }
            failure
        }
    }
}

mutation AdminLogout {
    admin {
        logout {
            ...AdminSessionFields
        }
    }
}

fragment AdminSessionFields on AdminSession {
    loggedIn
    passwordConfigured
}
