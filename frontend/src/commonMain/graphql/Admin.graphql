query AdminSession {
    admin {
        session {
            ...AdminSessionFields
        }
    }
}

query AdminAccountsScreen($cursor: String, $limit: Int) {
    admin {
        adminAccounts(cursor: $cursor, limit: $limit) {
            nodes {
                ...AdminAccountListFields
            }
            pageInfo {
                hasMore
                nextCursor
            }
        }
    }
}

query AdminAccountScreen($username: String!) {
    admin {
        adminAccount(username: $username) {
            ...AdminAccountScreenFields
        }
    }
}

query AdminAccountId($username: String!) {
    admin {
        adminAccount(username: $username) {
            account {
                id
            }
        }
    }
}

fragment AdminAccountListFields on AdminAccount {
    account {
        id
        username
        acct
        actorUrl
        displayName
        summary
    }
    createdAt
    followerCount
}

fragment AdminAccountScreenFields on AdminAccount {
    account {
        id
        username
        acct
        actorUrl
        displayName
        summary
    }
    createdAt
    followerCount
    feed {
        id
        url
        title
        siteUrl
        format
        lastFetchedAt
    }
    deliveryQueue {
        waitingCount
        failedCount
    }
    retryingDeliveries(limit: 20) {
        nodes {
            inbox
            attempts
            nextAttemptAt
            lastError
        }
        pageInfo {
            hasMore
        }
    }
    failedDeliveries(limit: 20) {
        nodes {
            inbox
            attempts
            lastError
        }
        pageInfo {
            hasMore
        }
    }
}

query AdminPreviewFeed($url: String!) {
    admin {
        previewFeed(url: $url) {
            preview {
                title
                siteUrl
                format
                description
                fullDescription
                itemCount
                sampleItems {
                    title
                    link
                    publishedAt
                }
            }
            failure {
                reason
            }
        }
    }
}

mutation AdminSaveFeed($saveFeedQuery: SaveFeedQuery!) {
    admin {
        saveFeed(saveFeedQuery: $saveFeedQuery) {
            feed {
                id
                url
                title
                siteUrl
                format
                lastFetchedAt
            }
            failure {
                reason
            }
        }
    }
}

query AdminUnpublishedFeedItems($query: UnpublishedFeedItemsQuery!) {
    admin {
        unpublishedFeedItems(query: $query) {
            items {
                title
                link
                publishedAt
            }
            failure {
                reason
            }
        }
    }
}

mutation AdminPostFeedItems($query: PostFeedItemsQuery!) {
    admin {
        postFeedItems(query: $query) {
            items {
                title
                link
                publishedAt
            }
            failure {
                reason
            }
        }
    }
}

mutation AdminLogin($password: String!) {
    admin {
        login(password: $password) {
            session {
                ...AdminSessionFields
            }
            failure
        }
    }
}

mutation AdminLogout {
    admin {
        logout {
            ...AdminSessionFields
        }
    }
}

mutation AdminUpdateAccountProfile($query: UpdateAccountProfileQuery!) {
    admin {
        updateAccountProfile(query: $query) {
            adminAccount {
                ...AdminAccountScreenFields
            }
            failure {
                unknownAccount
                displayNameMaxLength
                summaryMaxLength
            }
        }
    }
}

mutation AdminAddAccount($username: String!) {
    admin {
        addAccount(username: $username) {
            adminAccount {
                account {
                    acct
                }
            }
            failure {
                unusableCharacters
                maxLength
                minLength
                isDuplicated
            }
        }
    }
}

fragment AdminSessionFields on AdminSession {
    loggedIn
    passwordConfigured
}

query AdminNotes($username: String!, $cursor: String, $limit: Int!) {
    admin {
        notes(username: $username, cursor: $cursor, limit: $limit) {
            nodes {
                ...AdminNoteFields
            }
            pageInfo {
                hasMore
                nextCursor
            }
        }
    }
}

mutation AdminPostNote($username: String!, $body: String!) {
    admin {
        postNote(username: $username, body: $body) {
            note {
                ...AdminNoteFields
            }
            deliveryTargets
            failure {
                unknownAccount
                isEmpty
                maxLength
            }
        }
    }
}

fragment AdminNoteFields on AdminNote {
    id
    url
    contentHtml
    publishedAt
    feedItem {
        ...AdminFeedItemFields
    }
}

mutation AdminDeleteFeedItems($query: DeleteFeedItemsQuery!) {
    admin {
        deleteFeedItems(query: $query) {
            deletedIds
            failure {
                reason
            }
        }
    }
}

fragment AdminFeedItemFields on AdminFeedItem {
    id
    title
    link
    publishedAt
}

mutation AdminDeleteNote($query: DeleteNoteQuery!) {
    admin {
        deleteNote(query: $query) {
            deletedId
            failure {
                reason
            }
        }
    }
}

mutation AdminDeleteAccount($query: DeleteAccountQuery!) {
    admin {
        deleteAccount(query: $query) {
            failure {
                reason
            }
        }
    }
}
