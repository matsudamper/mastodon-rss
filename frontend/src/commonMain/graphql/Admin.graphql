query AdminSession {
    admin {
        session {
            ...AdminSessionFields
        }
    }
}

query AdminAccounts {
    admin {
        adminAccounts {
            ...AdminAccountFields
        }
    }
}

query AdminAccount($username: String!) {
    admin {
        adminAccount(username: $username) {
            ...AdminAccountFields
        }
    }
}

fragment AdminAccountFields on AdminAccount {
    account {
        username
        acct
        actorUrl
        displayName
        summary
    }
    createdAt
    followerCount
}

mutation AdminLogin($password: String!) {
    admin {
        login(password: $password) {
            session {
                ...AdminSessionFields
            }
            failure
        }
    }
}

mutation AdminLogout {
    admin {
        logout {
            ...AdminSessionFields
        }
    }
}

mutation AdminAddAccount($username: String!) {
    admin {
        addAccount(username: $username) {
            adminAccount {
                account {
                    acct
                }
            }
            failure {
                unusableCharacters
                maxLength
                minLength
                isDuplicated
            }
        }
    }
}

fragment AdminSessionFields on AdminSession {
    loggedIn
    passwordConfigured
}

query AdminNotes($username: String!, $cursor: String, $limit: Int!) {
    admin {
        notes(username: $username, cursor: $cursor, limit: $limit) {
            nodes {
                ...AdminNoteFields
            }
            pageInfo {
                hasMore
                nextCursor
            }
        }
    }
}

mutation AdminPostNote($username: String!, $body: String!) {
    admin {
        postNote(username: $username, body: $body) {
            note {
                ...AdminNoteFields
            }
            deliveryTargets
            delivered
            failure {
                unknownAccount
                isEmpty
                maxLength
            }
        }
    }
}

mutation AdminUpdateAccountProfile($username: String!, $displayName: String!, $summary: String!) {
    admin {
        updateAccountProfile(username: $username, displayName: $displayName, summary: $summary) {
            adminAccount {
                ...AdminAccountFields
            }
            failure {
                unknownAccount
                emptyDisplayName
                displayNameMaxLength
                summaryMaxLength
            }
        }
    }
}

fragment AdminNoteFields on AdminNote {
    url
    contentHtml
    publishedAt
}
