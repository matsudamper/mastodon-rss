query AdminSession {
    admin {
        session {
            ...AdminSessionFields
        }
    }
}

query AdminAccounts {
    admin {
        adminAccounts {
            account {
                username
                acct
                actorUrl
            }
            deletable
            createdAt
        }
    }
}

mutation AdminLogin($password: String!) {
    admin {
        login(password: $password) {
            session {
                ...AdminSessionFields
            }
            failure
        }
    }
}

mutation AdminLogout {
    admin {
        logout {
            ...AdminSessionFields
        }
    }
}

mutation AdminAddAccount($username: String!) {
    admin {
        addAccount(username: $username) {
            adminAccount {
                account {
                    acct
                }
            }
            failure {
                unusableCharacters
                maxLength
                minLength
                isDuplicated
            }
        }
    }
}

fragment AdminSessionFields on AdminSession {
    loggedIn
    passwordConfigured
}
