query AdminSession {
    admin {
        session {
            ...AdminSessionFields
        }
    }
}

query AdminAccounts {
    admin {
        adminAccounts {
            ...AdminAccountFields
        }
    }
}

query AdminAccount($username: String!) {
    admin {
        adminAccount(username: $username) {
            ...AdminAccountFields
        }
    }
}

fragment AdminAccountFields on AdminAccount {
    account {
        id
        username
        acct
        actorUrl
    }
    createdAt
    followerCount
    feed {
        id
        url
        title
        siteUrl
        format
    }
}

query AdminPreviewFeed($url: String!) {
    admin {
        previewFeed(url: $url) {
            preview {
                title
                siteUrl
                format
                description
                itemCount
                sampleItems {
                    title
                    link
                    publishedAt
                }
            }
            failure {
                reason
            }
        }
    }
}

mutation AdminSaveFeed($accountId: AccountId!, $url: String!, $postExistingItems: Boolean!) {
    admin {
        saveFeed(accountId: $accountId, url: $url, postExistingItems: $postExistingItems) {
            feed {
                id
                url
                title
                siteUrl
                format
            }
            postedCount
            skippedCount
            failure {
                reason
            }
        }
    }
}

mutation AdminLogin($password: String!) {
    admin {
        login(password: $password) {
            session {
                ...AdminSessionFields
            }
            failure
        }
    }
}

mutation AdminLogout {
    admin {
        logout {
            ...AdminSessionFields
        }
    }
}

mutation AdminAddAccount($username: String!) {
    admin {
        addAccount(username: $username) {
            adminAccount {
                account {
                    acct
                }
            }
            failure {
                unusableCharacters
                maxLength
                minLength
                isDuplicated
            }
        }
    }
}

fragment AdminSessionFields on AdminSession {
    loggedIn
    passwordConfigured
}

query AdminNotes($username: String!, $cursor: String, $limit: Int!) {
    admin {
        notes(username: $username, cursor: $cursor, limit: $limit) {
            nodes {
                ...AdminNoteFields
            }
            pageInfo {
                hasMore
                nextCursor
            }
        }
    }
}

mutation AdminPostNote($username: String!, $body: String!) {
    admin {
        postNote(username: $username, body: $body) {
            note {
                ...AdminNoteFields
            }
            deliveryTargets
            delivered
            failure {
                unknownAccount
                isEmpty
                maxLength
            }
        }
    }
}

fragment AdminNoteFields on AdminNote {
    url
    contentHtml
    publishedAt
}
