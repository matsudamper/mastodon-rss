query AdminSession {
    admin {
        session {
            ...AdminSessionFields
        }
    }
}

query AdminAccounts {
    admin {
        accounts {
            username
            acct
            actorUrl
            createdAt
        }
    }
}

mutation AdminLogin($password: String!) {
    admin {
        login(password: $password) {
            session {
                ...AdminSessionFields
            }
            failure
        }
    }
}

mutation AdminLogout {
    admin {
        logout {
            ...AdminSessionFields
        }
    }
}

mutation AdminAddAccount($username: String!) {
    admin {
        addAccount(username: $username) {
            account {
                acct
            }
            failure
            unusableCharacters
            maxLength
        }
    }
}

fragment AdminSessionFields on AdminSession {
    loggedIn
    passwordConfigured
}
